name: CPU compiler checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DEUTERON_TEST_DEVICE: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install compiler and type checker
        run: python -m pip install ".[dev]"
      - name: Validate dependencies
        run: python -m pip check
      - name: CPU tests
        run: python -m unittest discover -s tests -v
      - name: Type check
        run: python -m pyrefly check --preset default --python-interpreter-path "$(command -v python)" compiler compile.py benchmark.py tests/test_cli.py tests/test_runtime.py tests/test_validation.py
      - name: Compile supported targets without a GPU
        run: |
          for arch in sm_80 sm_86 sm_89 sm_90 sm_100 sm_110 sm_120; do
            deuteron examples/vector_add/vector_add.ir.json --arch "$arch" > "$RUNNER_TEMP/$arch.ptx"
          done
      - name: Build wheel and offline installation
        run: |
          python -m pip wheel . --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/wheelhouse" deuteron-compiler
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/wheel-test/bin/deuteron" --version
          "$RUNNER_TEMP/wheel-test/bin/deuteron" "$GITHUB_WORKSPACE/examples/vector_add/vector_add.ir.json" --arch sm_120 > wheel-smoke.ptx
          test -s wheel-smoke.ptx
